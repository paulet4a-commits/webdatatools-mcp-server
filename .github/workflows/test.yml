name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A weekly run catches breakage in the upstream Actors even when nothing here changes.
    - cron: '17 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci || npm install
      - run: npm test
